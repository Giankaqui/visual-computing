[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradient-domain"
version = "0.1.0"
description = "Gradient-domain image processing: seamless cloning, texture flattening and HDR tone mapping on top of geometric multigrid Poisson solvers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Giancarlo Kaqui Valenzuela" }]
keywords = ["poisson-image-editing", "multigrid", "tone-mapping", "computational-photography"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
gradient-domain = "gradient_domain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradient_domain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: scaling studies that take several seconds"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
